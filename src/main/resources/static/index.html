<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD KTP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Manajemen Data KTP</h1>
    <p class="subtitle">Client-side HTML, CSS, JavaScript, Ajax jQuery</p>

    <div id="notification" class="notification hidden"></div>

    <div class="card">
        <h2 id="form-title">Tambah Data KTP</h2>

        <form id="ktpForm">
            <input type="hidden" id="ktpId">

            <div class="grid">
                <div>
                    <label for="nomorKtp">Nomor KTP</label>
                    <input type="text" id="nomorKtp" maxlength="16" required>
                </div>

                <div>
                    <label for="namaLengkap">Nama Lengkap</label>
                    <input type="text" id="namaLengkap" required>
                </div>

                <div>
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" rows="3" required></textarea>
                </div>

                <div>
                    <label for="tanggalLahir">Tanggal Lahir</label>
                    <input type="date" id="tanggalLahir" required>
                </div>

                <div>
                    <label for="jenisKelamin">Jenis Kelamin</label>
                    <select id="jenisKelamin" required>
                        <option value="">-- Pilih Jenis Kelamin --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn primary">Simpan</button>
                <button type="button" id="cancelEdit" class="btn secondary hidden">Batal Edit</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="table-header">
            <h2>Daftar Data KTP</h2>
            <button id="refreshBtn" class="btn secondary">Refresh</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nomor KTP</th>
                    <th>Nama Lengkap</th>
                    <th>Alamat</th>
                    <th>Tanggal Lahir</th>
                    <th>Jenis Kelamin</th>
                    <th>Aksi</th>
                </tr>
                </thead>
                <tbody id="ktpTableBody">
                <tr>
                    <td colspan="7" class="empty">Memuat data...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
